<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Untitled Civ Game</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/hud.css" />
</head>
<body>
  <div id="game-root"></div>

  <!-- Phaser engine (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>

  <!-- Shared data (define globals: UCG_CONST, UCG_BUILDINGS, ...) -->
  <script src="shared/constants.js"></script>
  <script src="shared/data-buildings.js"></script>
  <script src="shared/data-units.js"></script>
  <script src="shared/data-eras.js"></script>
  <script src="shared/data-techs.js"></script>
  <script src="shared/data-civs.js"></script>

  <!-- Net + state -->
  <script src="js/net.js"></script>
  <script src="js/state.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/interp.js"></script>

  <!-- Scenes + render subsystems -->
  <script src="js/boot-scene.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/cursors.js"></script>
  <script src="js/lobby-scene.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/render-cursors.js"></script>
  <script src="js/render-entities.js"></script>
  <script src="js/input.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/minimap.js"></script>
  <script src="js/tooltips.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/game-scene.js"></script>

  <!-- Bootstrap Phaser -->
  <script>
    (function () {
      const config = {
        type: Phaser.AUTO,
        parent: 'game-root',
        backgroundColor: '#1b2b1b',
        pixelArt: true,
        scale: { mode: Phaser.Scale.RESIZE, width: '100%', height: '100%' },
        scene: [UCG.BootScene, UCG.LobbyScene, UCG.GameScene]
      };
      UCG.game = new Phaser.Game(config);
    })();
  </script>
</body>
</html>
